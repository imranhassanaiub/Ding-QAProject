name: QA Automation Suite

# Runs the full Selenium/TestNG/Cucumber suite against saucedemo.com
# on every push and pull request, plus on-demand via workflow_dispatch.
on:
  push:
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Chrome is available
        run: google-chrome --version

      # DriverManager launches Chrome in headed mode with no headless
      # toggle, and GitHub-hosted runners have no display. Xvfb gives
      # headed Chrome a virtual display so the suite runs unmodified.
      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Compile
        run: mvn -B -q clean compile test-compile

      - name: Run TestNG suite (Login → Checkout flow)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" mvn -B test

      - name: Run Cucumber BDD suite
        if: always()
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" mvn -B test -Dtest=Runner

      - name: Upload TestNG HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: test-output/
          retention-days: 14

      - name: Upload Surefire raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports.html
          retention-days: 14
          if-no-files-found: ignore
